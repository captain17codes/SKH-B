# Fly.io deployment for the CRPP backend.
#
# Chosen over a serverless host because this API is stateful in two ways that
# ephemeral filesystems cannot serve: the whole data layer is a SQLite file, and
# uploaded complaint photos are written to disk. The [[mounts]] volume below is
# what makes both survive a restart.
#
# Change `app` if the name is taken, then: fly deploy

app = 'kopargaon-crpp'
primary_region = 'bom'   # Mumbai -- closest region to Kopargaon.

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  # Must stay inside /data (the volume). Anywhere else and the database is lost
  # on the next deploy.
  CRPP_DB_PATH = '/data/crpp.db'
  UPLOAD_DIR = '/data/uploads'
  CIVIC_TIMEZONE = 'Asia/Kolkata'
  # The optional heavy wheels (scikit-learn, shap, ortools) are not installed in
  # the image, so tell the backend not to probe for them. Exact TOPSIS
  # attribution and the DP knapsack are unaffected -- see
  # backend/requirements-optional.txt.
  ENABLE_SHAP = 'false'
  KNAPSACK_SOLVER = 'dp'
  # Deliberately false: there is no login screen in src/pages yet, so enforcing
  # auth would make every page in the UI fail. This leaves the API publicly
  # writable -- flip to 'true' once a login flow exists.
  ENFORCE_AUTH = 'false'
  # Uncomment and set to the Vercel URL to stop mirroring arbitrary origins.
  # CORS_ORIGINS = 'https://your-app.vercel.app'

# One machine only. Two machines would each open the same SQLite file over a
# volume that is attached to exactly one of them; there is no clustering here.
[[mounts]]
  source = 'crpp_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # Left running rather than scaled to zero: a cold start in the middle of a
  # judged demo is worse than the idle cost.
  auto_stop_machines = 'off'
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
