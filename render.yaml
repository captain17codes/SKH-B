# Render Blueprint -- Kopargaon CRPP backend.
#
# Free web services on Render have NO persistent disk: the container's filesystem
# is rebuilt on every deploy and on every wake from sleep. Our data layer is a
# sqlite file and our photographs are files on disk, so both are wiped each time.
#
# That is survivable here, and deliberately so, because `seed_demo_data.py` is
# both fast (~3 s) and idempotent -- it refuses to touch a database that already
# holds tickets. So the start command seeds first, then serves. A judge who
# opens the link after a restart still finds 31 complaints, a costed plan with
# real deferrals, a merged duplicate cluster and stored explanations, instead of
# an empty table. Nothing is fabricated: it is the same seed script the team
# demos locally.
#
# The two commands are joined with `;` not `&&` on purpose: the seed script exits
# non-zero when it refuses an already-populated database, which is the normal
# case on a warm restart and must not stop uvicorn from booting.

services:
  - type: web
    name: kopargaon-crpp-api
    runtime: python
    plan: free
    region: singapore          # closest Render region to Kopargaon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_demo_data.py ; uvicorn main:app --host 0.0.0.0 --port $PORT
    # Render pings this to decide the service is live; it is also what the
    # keep-alive cron should hit (see DEPLOY.md).
    healthCheckPath: /health
    envVars:
      # Pinned. Render's default Python moves, and a resolver change on judging
      # day is a failure mode with no upside.
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CIVIC_TIMEZONE
        value: Asia/Kolkata
      # Signs JWTs. Render generates a random value once and keeps it; never
      # ship the "dev-only-change-me" default to a public URL.
      - key: SECRET_KEY
        generateValue: true
      # Set this by hand in the dashboard to the Vercel URL once the frontend is
      # deployed. Left as "*" it works but permits any origin.
      - key: CORS_ORIGINS
        sync: false
      # The seeded officer login. Set a real value in the dashboard -- the code
      # default is admin/admin123, which must not be the password on a public
      # deployment.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Endpoints decode tokens but never reject on missing auth. Kept false so
      # the frontend (login screen still in progress) is not blocked. See the
      # security note in DEPLOY.md before sharing the URL widely.
      - key: ENFORCE_AUTH
        value: "false"
      # SHAP and OR-Tools are not installed on the free tier (large wheels, 512 MB
      # limit). Both features have exact fallbacks; these flags stop the startup
      # capability probes from reporting a missing optional dependency as an error.
      - key: ENABLE_SHAP
        value: "false"
      - key: KNAPSACK_SOLVER
        value: dp
      - key: DEBUG
        value: "false"
